    />

    <meta name="theme-color" content="#F5F7F5" />
    <meta name="application-name" content="HERA" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />

    <meta property="og:locale" content="es_ES" />

    <meta property="og:title" content="Hera | Psicólogos online y gestión de consultas" />
    <meta
      property="og:description"
      content="Encuentra psicólogos online y presenciales, compara perfiles y precios. Si eres psicólogo, organiza tu consulta con agenda, pacientes y facturación en HERA."
    />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"

    />
    <meta
      name="google-site-verification"
      content="WvW2aVTUa9BIhO4PKaqViyIsjci6ZFnf_TjtYgyjdlE"
    />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }

      /* Keep nested screen scroll views inside the visible mobile viewport. */
      @supports (height: 100dvh) {
        html {
          height: 100dvh;
        }
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Reserve the landing's scrollbar before its deferred sections mount.
         Otherwise the hero moves sideways during the initial HTML handoff. */
      #landing-scroll-view {
        scrollbar-gutter: stable;
      }

      /* Calendar OAuth returns reload the web app. Keep context visible before React starts. */
      .calendar-boot {
        --boot-bg: #FAF8F3; --boot-card: #FFFDF8; --boot-text: #3E5C4F; --boot-border: #DCD5CA;
        box-sizing: border-box; position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
        background: var(--boot-bg); color: var(--boot-text); font: 15px/1.6 system-ui, sans-serif;
      }
      .calendar-boot[data-dark="true"] {
        --boot-bg: #24251F; --boot-card: #181914; --boot-text: #F3EBDD; --boot-border: #45473C;
      }
      .calendar-boot-card { box-sizing: border-box; width: 100%; max-width: 480px; padding: 32px 24px; text-align: center; border: 1px solid var(--boot-border); border-radius: 24px; background: var(--boot-card); }
      .calendar-boot-brand { margin: 0 0 24px; font: 32px Georgia, serif; letter-spacing: 2px; }
      .calendar-boot h1 { margin: 0 0 10px; font-size: 23px; line-height: 1.3; }
      .calendar-boot p { margin: 0; }
      .calendar-boot-indicator { width: 22px; height: 22px; margin: 24px auto 0; border: 2px solid var(--boot-border); border-top-color: var(--boot-text); border-radius: 50%; animation: calendar-boot-spin 1s linear infinite; }
      @keyframes calendar-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .calendar-boot-indicator { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>
      <main>
        <h1>HERA</h1>
        <p>Necesitas activar JavaScript para usar HERA.</p>
        <p>
          Puedes consultar nuestra
          <a href="/legal/privacidad">política de privacidad</a>
          y nuestros
          <a href="/legal/terminos">términos y condiciones</a>.
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <template id="calendar-boot-template">
      <main class="calendar-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="calendar-boot-card">
          <div class="calendar-boot-brand">HERA</div>
          <h1>Volviendo a tu agenda</h1>
          <p>Estamos preparando HERA para continuar con tu conexión de Google Calendar.</p>
          <div class="calendar-boot-indicator" aria-hidden="true"></div>
        </div>
      </main>
    </template>
    <script>
      if (window.location.pathname === '/integrations/google-calendar') {
        var calendarBoot = document.getElementById('calendar-boot-template').content.cloneNode(true);
        var calendarDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var calendarMode = window.localStorage.getItem('hera_theme_mode');
          if (calendarMode === 'dark' || calendarMode === 'light') calendarDark = calendarMode === 'dark';
        } catch (_) { /* System preference remains available without storage. */ }
        calendarBoot.querySelector('main').setAttribute('data-dark', String(calendarDark));
        document.getElementById('root').appendChild(calendarBoot);
      }
    </script>
  </body>
</html>
